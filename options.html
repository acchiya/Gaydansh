<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Random Clip — settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>Random Clip New Tab</h1>
      <p class="sub">
        This browser reads its settings from a file you host on GitHub. Change
        that file from your own laptop and this browser follows automatically.
      </p>

      <section class="card">
        <label class="field">
          <span class="label">Config file URL (the "raw" GitHub link)</span>
          <input type="text" id="url" class="text" spellcheck="false" />
        </label>
        <div class="row">
          <button id="save" class="btn">Save</button>
          <button id="check" class="btn ghost">Check now</button>
        </div>
      </section>

      <section class="card">
        <h2>What's live right now</h2>
        <div id="live" class="live">Not checked yet.</div>
        <button id="test" class="btn ghost" hidden>Test-play first clip</button>
      </section>

      <p id="status" class="status" aria-live="polite"></p>
    </div>

    <video id="preview" hidden></video>
    <script src="options.js"></script>
  </body>
</html>
